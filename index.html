<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        header, footer {
            background-color: #8267BE;
            color: #FFBD35;
            padding: 10px;
            border-radius: 5px;
        }

        .col {
            float: left;
            padding: 15px;
        }

        .menu {
            width: 25%;
        }

        .content {
            width: 75%;
        }

        .clearfix::after {
            content: "";
            display: block;
            clear: both;
        }

        h1 {
            margin: 0;
        }

        .menu ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .menu li {
            padding: 8px;
            margin-bottom: 8px;
            background-color: #502064;
            color: #fff;
            border-radius: 5px;
        }

        .menu li:hover {
            cursor: pointer;
            background-color: #8267BE;
        }

    </style>
</head>
<body>
    <header>
        <h2>Header</h2>
    </header>

    <main class="clearfix">
        <div class="menu col">
            <ul>
                <li>Html</li>
                <li>Css</li>
                <li>Javascript</li>
            </ul>
        </div>
        <div class="content col">
            <h1>Web Programlama Dersi</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ab pariatur doloribus sapiente assumenda eveniet qui consectetur facere corporis optio vel neque eum vitae ipsa, aliquid error magni. Quam, eaque culpa!</p>
        </div>
    </main>

    <footer>
        <h2>Footer</h2>
    </footer>
</body>
</html>
